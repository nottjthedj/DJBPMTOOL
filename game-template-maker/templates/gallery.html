<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="{{colors.bg}}" />
<meta name="robots" content="noindex" />
<title>{{brand.short}} Booth — Gallery</title>
<style>
  :root{--bg:{{colors.bg}};--primary:{{colors.primary}};--primary-bright:{{colors.primaryBright}};--secondary:{{colors.secondary}};--accent:{{colors.accent}};--ink:{{colors.ink}};--dim:{{colors.dim}};}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif;}
  .logo{font-family:"Arial Narrow",Impact,sans-serif;font-weight:900;font-style:italic;
    text-transform:uppercase;letter-spacing:-.5px;line-height:.9;}
  .logo .l1{color:var(--primary-bright);text-shadow:0 0 12px rgba({{colors.primaryRgb}},.7);}
  .logo .l2{color:var(--secondary);text-shadow:0 0 12px rgba({{colors.secondaryRgb}},.6);}
  .btn{border:0;cursor:pointer;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
    border-radius:11px;padding:11px 16px;font-size:14px;color:#fff;}
  .btn:active{transform:scale(.96);}
  .btn-pink{background:linear-gradient(135deg,var(--primary),var(--primary-bright));}
  .btn-ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:var(--ink);}

  /* gate */
  #gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;padding:30px;text-align:center;
    background:radial-gradient(120% 80% at 50% 0%,rgba({{colors.primaryRgb}},.16),transparent 60%),var(--bg);}
  #gate .logo{font-size:44px;}
  #gate input{width:100%;max-width:320px;padding:14px;border-radius:12px;font-size:16px;text-align:center;
    background:#1c1c26;border:1px solid rgba(255,255,255,.15);color:var(--ink);}
  #gate input:focus{outline:none;border-color:var(--primary);}
  #gateMsg{color:var(--primary);font-size:13px;font-weight:700;min-height:16px;}

  /* app */
  #app{display:none;}
  header{position:sticky;top:0;z-index:5;background:rgba({{colors.bgRgb}},.92);backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(255,255,255,.08);padding:14px 16px calc(14px);
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  header .logo{font-size:22px;}
  .tabs{display:flex;gap:6px;background:rgba(255,255,255,.07);border-radius:999px;padding:4px;}
  .tabs button{border:0;background:transparent;color:var(--dim);font-weight:800;text-transform:uppercase;
    letter-spacing:.04em;font-size:12px;padding:7px 16px;border-radius:999px;cursor:pointer;}
  .tabs button.active{background:#fff;color:{{colors.bg}};}
  .evsel{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);color:var(--ink);border-radius:999px;padding:8px 12px;font-weight:700;font-size:12px;max-width:240px;cursor:pointer;}
  .meta .ev{color:var(--secondary);font-weight:800;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .spacer{flex:1;}
  .count{color:var(--dim);font-size:13px;font-weight:700;}
  .iconbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;
    border-radius:10px;padding:9px 12px;cursor:pointer;font-size:14px;font-weight:800;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;padding:16px;}
  .card{background:#12121a;border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden;
    display:flex;flex-direction:column;}
  .media{position:relative;aspect-ratio:9/16;background:#000;overflow:hidden;}
  .media img,.media video{width:100%;height:100%;object-fit:cover;display:block;}
  .tag{position:absolute;top:8px;left:8px;background:rgba({{colors.bgRgb}},.7);border:1px solid rgba(255,255,255,.2);
    border-radius:999px;padding:3px 9px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;}
  .tag.vid{color:var(--secondary);}
  .approved-badge{position:absolute;top:8px;right:8px;background:rgba({{colors.secondaryRgb}},.15);color:var(--secondary);
    border:1px solid var(--secondary);border-radius:999px;padding:3px 9px;font-size:10px;font-weight:800;text-transform:uppercase;}
  .meta{padding:8px 10px;font-size:11px;color:var(--dim);border-bottom:1px solid rgba(255,255,255,.06);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .actions{display:flex;flex-wrap:wrap;gap:8px;padding:10px;}
  .actions .approve{flex:1 1 100%;}
  .share{background:linear-gradient(135deg,var(--primary),var(--primary-bright));color:#fff;}
  .dl{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid rgba(255,255,255,.18)!important;}
  .actions button{flex:1;border:0;border-radius:10px;padding:10px;font-weight:800;font-size:13px;cursor:pointer;
    text-transform:uppercase;letter-spacing:.03em;}
  .approve{background:linear-gradient(135deg,{{colors.secondaryDeep}},var(--secondary));color:{{colors.onSecondary}};}
  .del{background:rgba(255,45,45,.16);color:#ff6b6b;border:1px solid rgba(255,45,45,.4)!important;}
  .empty{padding:60px 20px;text-align:center;color:var(--dim);}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;
    background:rgba({{colors.bgRgb}},.94);border:1px solid rgba(255,255,255,.18);color:#fff;padding:11px 18px;
    border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<!-- passcode gate -->
<div id="gate">
  <div class="logo"><span class="l1">{{brand.short}}</span> <span class="l2">Gallery</span></div>
  <div style="color:var(--dim);font-size:14px;max-width:30ch;">Private review — enter the booth passcode to see tonight's captures.</div>
  <input id="gateInput" type="password" placeholder="Passcode" autocomplete="off" />
  <button class="btn btn-pink" id="gateBtn" style="min-width:200px;">Unlock</button>
  <div id="gateMsg"></div>
</div>

<!-- app -->
<div id="app">
  <header>
    <div class="logo"><span class="l1">{{brand.short}}</span> <span class="l2">Gallery</span></div>
    <div class="tabs">
      <button data-tab="incoming" class="active">New</button>
      <button data-tab="approved">Approved</button>
    </div>
    <select id="eventFilter" class="evsel"></select>
    <div class="spacer"></div>
    <span class="count" id="count"></span>
    <button class="iconbtn" id="refreshBtn">↻</button>
    <button class="iconbtn" id="logoutBtn">Lock</button>
  </header>
  <div class="grid" id="grid"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var TOKEN=localStorage.getItem('{{web.storagePrefix}}_gallery_token')||'';
  var tab='incoming';
  var allItems=[], activeEvent='all';
  var toastTimer=null;
  function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');
    clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},2400);}

  function api(path,opts){
    opts=opts||{};
    opts.headers=Object.assign({'x-gallery-token':TOKEN},opts.headers||{});
    return fetch(path,opts);
  }

  // ---- gate ----
  function tryUnlock(){
    var v=$('gateInput').value.trim();
    if(!v){return;}
    TOKEN=v;
    $('gateMsg').textContent='Checking…';
    api('/api/gallery-list?tab=incoming').then(function(r){
      if(r.status===401){ $('gateMsg').textContent='Wrong passcode.'; return; }
      if(!r.ok){ return r.json().then(function(d){ $('gateMsg').textContent=(d.error||('Error '+r.status)); }); }
      localStorage.setItem('{{web.storagePrefix}}_gallery_token',TOKEN);
      $('gate').style.display='none'; $('app').style.display='block';
      return r.json().then(render);
    }).catch(function(){ $('gateMsg').textContent='Network error.'; });
  }
  $('gateBtn').onclick=tryUnlock;
  $('gateInput').addEventListener('keydown',function(e){ if(e.key==='Enter') tryUnlock(); });

  // ---- load + render ----
  function load(){
    $('grid').innerHTML='<div class="empty">Loading…</div>';
    api('/api/gallery-list?tab='+tab).then(function(r){
      if(r.status===401){ logout(); return; }
      return r.json();
    }).then(function(d){ if(d) render(d); })
      .catch(function(){ $('grid').innerHTML='<div class="empty">Couldn\'t load. Tap ↻ to retry.</div>'; });
  }
  function fmt(o){
    var d=o.lastModified?new Date(o.lastModified):null;
    var when=d?d.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';
    var mb=o.size?(o.size/1048576).toFixed(1)+' MB':'';
    return [when,mb].filter(Boolean).join(' · ');
  }
  function eventOf(key){ var m=key.match(/^(?:incoming|approved)\/([^/]+)\//); return m?m[1]:'other'; }
  function prettyEvent(ev){ var i=ev.indexOf('_'); if(i<0) return ev; var slug=ev.slice(i+1); var name=slug.replace(/-/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();}); return name+' · '+ev.slice(0,i); }
  function buildEventFilter(){
    var sel=$('eventFilter'); if(!sel) return;
    var evs=[], seen={};
    allItems.forEach(function(o){ var e=eventOf(o.key); if(!seen[e]){seen[e]=1;evs.push(e);} });
    evs.sort().reverse();
    sel.style.display = evs.length>1 ? '' : 'none';
    sel.innerHTML='<option value="all">All events ('+allItems.length+')</option>'+evs.map(function(e){
      var n=0; allItems.forEach(function(o){ if(eventOf(o.key)===e) n++; });
      return '<option value="'+e+'">'+prettyEvent(e)+' ('+n+')</option>';
    }).join('');
    if(activeEvent!=='all' && !seen[activeEvent]) activeEvent='all';
    sel.value=activeEvent;
  }
  function render(d){ allItems=(d&&d.items)||[]; buildEventFilter(); renderGrid(); }
  function renderGrid(){
    var items = activeEvent==='all' ? allItems : allItems.filter(function(o){ return eventOf(o.key)===activeEvent; });
    $('count').textContent=items.length+(tab==='approved'?' approved':' new');
    var grid=$('grid');
    if(!items.length){ grid.innerHTML='<div class="empty">'+(tab==='approved'?'No approved shots here yet.':'No captures for this view yet.')+'</div>'; return; }
    grid.innerHTML='';
    items.forEach(function(o){
      var card=document.createElement('div'); card.className='card';
      var media = o.kind==='video'
        ? '<video src="'+o.url+'" playsinline muted preload="metadata" controls></video><span class="tag vid">▶ Video</span>'
        : '<img loading="lazy" src="'+o.url+'" alt=""><span class="tag">Photo</span>';
      var approvedBadge = tab==='approved' ? '<span class="approved-badge">✓ Approved</span>' : '';
      var acts = (tab==='approved' ? '' : '<button class="approve">✓ Approve</button>')
        + '<button class="share">↗ Share</button><button class="dl">⬇ Save</button><button class="del">Delete</button>';
      card.innerHTML='<div class="media">'+media+approvedBadge+'</div><div class="meta"><div class="ev">'+prettyEvent(eventOf(o.key))+'</div>'+fmt(o)+'</div><div class="actions">'+acts+'</div>';
      var ap=card.querySelector('.approve'), del=card.querySelector('.del');
      if(ap) ap.onclick=function(){ act('approve',o.key,card,ap); };
      del.onclick=function(){ if(confirm('Delete this capture permanently?')) act('delete',o.key,card,del); };
      var shareB=card.querySelector('.share'), dlB=card.querySelector('.dl');
      if(shareB) shareB.onclick=function(){ shareItem(o, shareB); };
      if(dlB) dlB.onclick=function(){ downloadItem(o, dlB); };
      grid.appendChild(card);
    });
  }
  function act(action,key,card,btn){
    btn.disabled=true; btn.textContent='…';
    api('/api/gallery-action',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:action,key:key})}).then(function(r){
      if(r.status===401){ logout(); return; }
      return r.json().then(function(d){
        if(!r.ok||!d.ok){ toast(d.error||'Failed'); btn.disabled=false; btn.textContent=(action==='approve'?'✓ Approve':'Delete'); return; }
        if(action==='approve'){ toast('Approved ✓ — added to your Approved folder'); card.style.opacity='.5'; if(btn){btn.textContent='Approved';} }
        else { toast('Deleted'); card.remove(); }
        var n=parseInt($('count').textContent,10); if(!isNaN(n)&&action==='delete'){ $('count').textContent=(n-1)+(tab==='approved'?' approved':' new'); }
      });
    }).catch(function(){ toast('Network error'); btn.disabled=false; });
  }

  function dlBlob(blob,name){ var u=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(u);},3000); }
  function nameFor(o){ return (o.key.split('/').pop())||('{{web.storagePrefix}}.'+(o.kind==='video'?'mp4':'jpg')); }
  function shareItem(o, btn){
    var orig=btn.textContent; btn.disabled=true; btn.textContent='…';
    fetch(o.url).then(function(r){return r.blob();}).then(function(blob){
      var file=new File([blob], nameFor(o), {type:blob.type||(o.kind==='video'?'video/mp4':'image/jpeg')});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        return navigator.share({files:[file], text:'{{brand.name}} \ud83d\udcf8 {{brand.hashtag}}'});
      }
      dlBlob(blob, nameFor(o)); toast('Downloaded — post it from your device');
    }).catch(function(){ toast('Couldn\u2019t share — try Save'); })
      .then(function(){ btn.disabled=false; btn.textContent=orig; });
  }
  function downloadItem(o, btn){
    var orig=btn.textContent; btn.disabled=true; btn.textContent='…';
    fetch(o.url).then(function(r){return r.blob();}).then(function(blob){
      dlBlob(blob, nameFor(o)); toast('Downloaded \u2713');
    }).catch(function(){ toast('Download failed'); })
      .then(function(){ btn.disabled=false; btn.textContent=orig; });
  }

  function logout(){ TOKEN=''; localStorage.removeItem('{{web.storagePrefix}}_gallery_token');
    $('app').style.display='none'; $('gate').style.display='flex'; $('gateInput').value=''; $('gateMsg').textContent=''; }

  $('eventFilter').onchange=function(){ activeEvent=this.value; renderGrid(); };
  [].forEach.call(document.querySelectorAll('.tabs button'),function(b){
    b.onclick=function(){ tab=b.getAttribute('data-tab');
      [].forEach.call(document.querySelectorAll('.tabs button'),function(x){x.classList.remove('active');});
      b.classList.add('active'); load(); };
  });
  $('refreshBtn').onclick=load;
  $('logoutBtn').onclick=logout;

  // auto-enter if we already have a saved token
  if(TOKEN){
    api('/api/gallery-list?tab=incoming').then(function(r){
      if(r.ok){ $('gate').style.display='none'; $('app').style.display='block'; return r.json().then(render); }
      else { logout(); }
    }).catch(function(){ /* stay on gate */ });
  }
})();
</script>
</body>
</html>
