name: Build Booth Studio (desktop app)

# Builds the shareable, double-click Booth Studio app for Windows, macOS and Linux.
# Download the results from this run's "Artifacts", or attach them to a v* release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a permanent Release under this tag (e.g. v1.0.0). Blank = just build artifacts."
        required: false
        default: ""
  push:
    branches:
      - claude/game-template-maker-50sryl
    paths:
      - "game-template-maker/**"
      - ".github/workflows/build-booth-studio.yml"
    tags:
      - "v*"

permissions:
  contents: write   # allow attaching built apps to a Release on v* tags

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: BoothStudio-Windows
          - os: macos-latest
            artifact: BoothStudio-macOS
          - os: ubuntu-latest
            artifact: BoothStudio-Linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: game-template-maker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build app
        run: pyinstaller --noconfirm booth-studio.spec

      - name: Package (macOS — zip the .app)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r -y "Booth Studio-macOS.zip" "Booth Studio.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            game-template-maker/dist/Booth Studio.exe
            game-template-maker/dist/Booth Studio-macOS.zip
            game-template-maker/dist/Booth Studio
          if-no-files-found: warn

      # On a v* tag, attach the built app to a GitHub Release. Release assets do
      # not expire (unlike the 90-day Actions artifacts above). Each OS job adds
      # its own file to the same release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          name: Booth Studio ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body: |
            Booth Studio — the desktop app for the Game Template Maker.
            Download for your platform below, then see game-template-maker/README.md.
            First launch (unsigned): Windows → "More info → Run anyway"; macOS → right-click → Open.
          files: |
            game-template-maker/dist/Booth Studio.exe
            game-template-maker/dist/Booth Studio-macOS.zip
            game-template-maker/dist/Booth Studio
          fail_on_unmatched_files: false
